<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Pinch-zoom stays ENABLED (accessibility + dense tables on phones).
     Double-tap zoom is already suppressed by touch-action: manipulation. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#323230" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>RIDD Sales App</title>

<!-- ───────────────────────── STYLES ───────────────────────── -->
<!-- Tailwind is PREBUILT into tailwind.css. It used to load the Play CDN —
     a ~350KB render-blocking compiler that re-scanned the whole DOM on every
     render, the single biggest cause of slow loads. If you add NEW utility
     classes, rebuild from the repo root with:
       npm run tailwind     (app/tailwind.config.js, app/src/styles/tailwind.in.css → app/public/tailwind.css)
     (config: RIDD colors + Inter font + forms/typography plugins, scanning
     public/index.html and src/**/*.js) -->
<link rel="stylesheet" href="tailwind.css" />
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- Leaflet + Turf (the Geographic map stack, ~700KB) now load ON DEMAND
     from app.js (ensureMapLibs) the first time a map view renders — they
     no longer download on every page load. -->
<!-- (RIDD Tailwind tokens now live in the prebuilt tailwind.css — see note above.) -->
<!-- Fonts load ASYNC (media=print swap trick): the splash paints on system
     fonts instantly instead of white-screening behind third-party CSS. -->
<!-- Boot-path network warmup: the app can't render until the Supabase SDK
     module arrives and the session/profile queries answer — start those
     connections during HTML parse instead of after the 1.8MB script parses. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RIDD" />
<!-- supabase-js is VENDORED (./vendor-supabase.js) — preload the real file
     so it downloads in parallel with the big app module instead of being
     discovered only after the 2.9MB script parses (removes a serial RTT). -->
<link rel="modulepreload" href="vendor-supabase.js" />
<link rel="preconnect" href="https://iqlrndyuiolbxhhwmsqv.supabase.co" crossorigin />
<!-- Type: self-hosted from Cam's RIDDMADE design kit (fonts/, OFL). No Google
     Fonts CDN — the exact files whyridd.com ships, full upstream builds with the
     ʻokina (U+02BB) hand-mapped in Archivo so Polynesian rep names render whole.
     Anton = headlines, Archivo (variable) = the voice, IBM Plex Mono = labels
     and every figure. See fonts/MODIFICATIONS.txt and docs/design-kit/BRAND.md. -->
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/Anton-Regular.woff2" as="font" type="font/woff2" crossorigin />
<!-- The app's own CSS (fonts, theme tokens, components, gap-fill utilities) — was inline here;
     now app/src/styles/app.css, copied to app.css by the build. Same cascade position. -->
<link rel="stylesheet" href="app.css" />

<!-- Apply theme before body paints to avoid flash -->
<script>
  (function() {
    var saved = localStorage.getItem('ridd-theme');
    var theme = saved || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body class="min-h-screen">

<!-- ═══════════════════════════════════════════════════════════════
     CONFIG — per-deployment values live in config.js (window.RIDD_CONFIG)
     ═══════════════════════════════════════════════════════════════ -->
<script src="config.js"></script>
<script>
     console.log('test publish from new pipeline') // Proving new publish path, delete after.
</script> 

<!-- ═══════════════════════════════════════════════════════════════
     ROOT MOUNT
     ═══════════════════════════════════════════════════════════════ -->
<div id="app">
  <!-- Static boot splash — paints INSTANTLY (no JS needed) while the app
       script parses and the first network calls run. The first mount()
       clears #app, so this vanishes the moment the real UI is ready. -->
  <!-- Pinned to the viewport (per Isaac, Oct 18): an in-flow 100vh box moved when a reload restored the
       old scroll spot or the phone's toolbar/safe-area resized the page, so the mark jumped mid-boot. -->
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1">
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div id="splashMark" style="color:var(--text);line-height:0"><svg viewBox="0 0 329.24 26.72" width="220" height="18" fill="currentColor" aria-label="RIDDMADE"><path d="M0,26.72V0h27.66c6.62,0,11.91,2.15,11.91,9.83,0,6.07-3.8,8.93-9.44,9.56l-.71.08,1.88.98,8.31,6.27h-13.21l-8.46-6.66h-7.37v6.66H0ZM10.58,12.23h15.91c1.49,0,2.12-.39,2.12-1.57,0-1.37-.63-1.65-2.12-1.65h-15.91v3.21Z"/><path d="M41.77,26.72V0h10.58v26.72h-10.58Z"/><path d="M55.48,26.72V0h27.82c8.35,0,15.05,2.82,15.05,13.32s-6.82,13.4-15.05,13.4h-27.82ZM66.06,17.71h16.18c3.49,0,5.13-.35,5.13-4.39s-1.65-4.31-5.13-4.31h-16.18v8.7Z"/><path d="M100.69,26.72V0h27.82c8.35,0,15.05,2.82,15.05,13.32s-6.82,13.4-15.05,13.4h-27.82ZM111.27,17.71h16.18c3.49,0,5.13-.35,5.13-4.39s-1.65-4.31-5.13-4.31h-16.18v8.7Z"/><path d="M145.91,26.72V0h12.85l13.79,18.06L186.35,0h12.62v26.72h-10.58v-14.15l-10.58,14.15h-10.74l-10.58-14.18v14.18h-10.58Z"/><path d="M231.33,22.3h-16.34l-2.55,4.43h-12.7L216.16,0h14.15l16.42,26.72h-12.85l-2.55-4.43ZM227.17,15.05l-4-6.94-4.04,6.94h8.03Z"/><path d="M247.5,26.72V0h27.82c8.35,0,15.05,2.82,15.05,13.32s-6.82,13.4-15.05,13.4h-27.82ZM258.08,17.71h16.18c3.49,0,5.13-.35,5.13-4.39s-1.65-4.31-5.13-4.31h-16.18v8.7Z"/><path d="M292.72,26.72V0h36.52v8.23h-25.94v1.76h25.2v6.66h-25.2v1.84h25.94v8.23h-36.52Z"/></svg></div>
      <!-- (The "Sales" word under the wordmark retired per Isaac, Sep 22 — wordmark + spinner, centered.) -->
      <span class="spinner" style="width:20px;height:20px;margin-top:2px"></span>
    </div>
  </div>
  <script>
    // Swap the text wordmark for the REAL company logo when this browser has
    // it cached (the app stores the uploaded logo as a data URL under
    // 'ridd-spin-logo-v1'). Runs before the app bundle parses, so the actual
    // logo paints instantly; a first-ever visit falls back to the wordmark.
    try {
      var _splashLogo = localStorage.getItem('ridd-spin-logo-v1');
      if (_splashLogo && /^data:image\//.test(_splashLogo)) {
        var _mark = document.getElementById('splashMark');
        if (_mark && false) { /* the RIDDMADE wordmark is the splash now (design kit) — the uploaded logo is no longer swapped in */ }
      }
    } catch (e) { /* wordmark fallback */ }
  </script>
</div>

<!-- Toast container -->
<!-- Toasts: right-aligned column pinned below the iOS notch/status bar
     (safe-area inset) and bounded on BOTH sides so long messages wrap
     instead of running off-screen on mobile. -->
<div id="toasts" class="fixed right-4 z-50 flex flex-col gap-2 pointer-events-none items-end" style="top: calc(1rem + env(safe-area-inset-top, 0px)); left: 1rem;"></div>

<!-- Supabase JS (ESM from CDN) + the app -->
<script type="module" src="app.js"></script>
</body>
</html>
