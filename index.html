<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Pinch-zoom stays ENABLED (accessibility + dense tables on phones).
     Double-tap zoom is already suppressed by touch-action: manipulation. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#323230" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>RIDD Sales App</title>

<!-- ───────────────────────── STYLES ───────────────────────── -->
<!-- Tailwind is PREBUILT into tailwind.css. It used to load the Play CDN —
     a ~350KB render-blocking compiler that re-scanned the whole DOM on every
     render, the single biggest cause of slow loads. If you add NEW utility
     classes, rebuild with:
       npx tailwindcss -c tailwind.config.js -i in.css -o tailwind.css --minify
     (config mirrors the old inline tailwind.config: RIDD colors + Inter font
     + forms/typography plugins, content: ['index.html']) -->
<link rel="stylesheet" href="tailwind.css" />
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- Leaflet + Turf (the Geographic map stack, ~700KB) now load ON DEMAND
     from app.js (ensureMapLibs) the first time a map view renders — they
     no longer download on every page load. -->
<!-- (RIDD Tailwind tokens now live in the prebuilt tailwind.css — see note above.) -->
<!-- Fonts load ASYNC (media=print swap trick): the splash paints on system
     fonts instantly instead of white-screening behind third-party CSS. -->
<!-- Boot-path network warmup: the app can't render until the Supabase SDK
     module arrives and the session/profile queries answer — start those
     connections during HTML parse instead of after the 1.8MB script parses. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RIDD" />
<!-- supabase-js is VENDORED (./vendor-supabase.js) — preload the real file
     so it downloads in parallel with the big app module instead of being
     discovered only after the 2.9MB script parses (removes a serial RTT). -->
<link rel="modulepreload" href="vendor-supabase.js" />
<link rel="preconnect" href="https://iqlrndyuiolbxhhwmsqv.supabase.co" crossorigin />
<!-- Type: self-hosted from Cam's RIDDMADE design kit (fonts/, OFL). No Google
     Fonts CDN — the exact files whyridd.com ships, full upstream builds with the
     ʻokina (U+02BB) hand-mapped in Archivo so Polynesian rep names render whole.
     Anton = headlines, Archivo (variable) = the voice, IBM Plex Mono = labels
     and every figure. See fonts/MODIFICATIONS.txt and docs/design-kit/BRAND.md. -->
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/Anton-Regular.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: 'Archivo'; src: url('fonts/Archivo-Variable.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('fonts/IBMPlexMono-Regular.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }
  @font-face { font-family: 'Anton'; src: url('fonts/Anton-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
</style>
<style>
  /* ═══════════════ THEME TOKENS ═══════════════ */
  /* RIDD brand (RPS Brand Guide, Sep 2026): sage #5F6C5B · charcoal #323230 ·
     orange #DF643A. Light theme = white cards on a faint SAGE-tinted canvas
     (per Isaac: cream cards didn't work on screen — cream stays on the
     printed slicks; the sage tint carries the brand instead). Orange stays
     the accent in both themes. */
  /* LIGHT = the Riddmarket "white room" Cam signed (design kit, DESIGN.md,
     2026-09-15): white ground, charcoal ink, hairlines for structure — no
     tinted canvas. Panels are told apart by a hairline, not a fill. */
  :root[data-theme="light"] {
    --bg:          #FFFFFF;
    --bg-subtle:   #F4F2EC;
    --card:        #FFFFFF;
    --card-2:      #F4F2EC;
    --border:      rgba(0,0,0,.14);
    --border-2:    rgba(0,0,0,.30);
    --text:        #323230;
    --text-muted:  rgba(0,0,0,.62);
    --text-subtle: rgba(0,0,0,.45);
    --input-bg:    #FFFFFF;
    --input-border:rgba(0,0,0,.30);
    --header-bg:   #FFFFFF;
    --header-text: #323230;
    --sidebar-bg:  #FFFFFF;
    --sidebar-border:rgba(0,0,0,.14);
    --accent:      #DF643A;
    --accent-hover:#C8552E;
    --accent-text: #FFFFFF;
    --brand-sage:  #5F6C5B;
    --brand-cream: #FBF4DA;
    --brand-charcoal:#323230;
    --brand-orange:#DF643A;
    --shadow-sm:   0 1px 2px rgba(0,0,0,.03);
    --shadow:      0 1px 2px rgba(0,0,0,.05);
    --shadow-lg:   0 16px 40px -12px rgba(0,0,0,.12);
    --font-display: 'Anton', 'Inter', ui-sans-serif, system-ui, sans-serif;
  }
  /* DARK = Deck 2.0 (design kit, 2026-08-26): a genuinely dark, slightly
     cool ground that survives screen-share compression, three stacked
     surface values so panels read without outlines, and the brand orange
     pushed to "ember" so it holds its chroma. Every pair measured ≥4.5:1. */
  :root[data-theme="dark"] {
    --bg:          #0A0B0D;
    --bg-subtle:   #14161A;
    --card:        #14161A;
    --card-2:      #1E2128;
    --border:      #2B2F38;
    --border-2:    #3A3F4A;
    --text:        #F4F6F8;
    --text-muted:  #9AA2B1;
    --text-subtle: #6E7583;
    --input-bg:    #1E2128;
    --input-border:#3A3F4A;
    --header-bg:   #0A0B0D;
    --header-text: #F4F6F8;
    --sidebar-bg:  #0A0B0D;
    --sidebar-border:#2B2F38;
    --accent:      #FF5F2E;
    --accent-hover:#FF7A50;
    --accent-text: #FFFFFF;
    --brand-sage:  #5F6C5B;
    --brand-cream: #FBF4DA;
    --brand-charcoal:#323230;
    --brand-orange:#DF643A;
    --shadow-sm:   0 1px 2px rgba(0,0,0,.4);
    --shadow:      0 1px 3px rgba(0,0,0,.5);
    --shadow-lg:   0 16px 40px -12px rgba(0,0,0,.6);
    --font-display: 'Anton', 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  html {
    font-family: 'Archivo', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;      /* crisp, macOS-style glyphs */
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  /* Eyebrow labels (the tiny uppercase tracked captions everywhere) render
     in IBM Plex Mono — the whyridd.com editorial signature. */
  [class*="tracking-widest"], [class*="tracking-wider"], .hb-kicker, .tabular-nums, .font-mono {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Plex Mono ships one weight in the kit; a bold utility on a figure would
     synthesize a faux bold. Let the size carry the hierarchy instead. */
  .tabular-nums.font-black, .tabular-nums.font-bold, .tabular-nums.font-semibold { font-weight: 500; }
  body {
    background: var(--bg);
    color: var(--text);
    transition: background-color .15s ease, color .15s ease;
    /* Kill double-tap-to-zoom on iOS (the viewport meta blocks pinch; this
       blocks the double-tap gesture so taps also register ~300ms faster). */
    touch-action: manipulation;
  }
  /* The PAGE never pans sideways — any content wider than the screen must
     scroll inside its own .scroll-x container, not drag the whole app. */
  html, body { overflow-x: hidden; max-width: 100%; overscroll-behavior-x: none; }

  /* ── Mobile polish (per Isaac, Jul 2026) — the two loudest offenders were
     the month calendar (7 columns of 120px cells on a 380px screen) and the
     Revenue Goals card at the top of Sales. General rules below keep dense
     desktop layouts breathable on phones without touching desktop. */
  /* Calendar mobile hooks (styled inside the phone media query below). */
  .cal-layout, .cal-sidebar, .cal-sidebar-head, .cal-agent-list, .cal-agent-row, .cal-agent-hours, .cal-agent-edit, .cal-add-badge, .cal-chip, .cal-chip-name, .cal-chip-time, .cal-legend { }
  /* Scorecards summary strip with the 1:1 cadence card (5 across on desktop). */
  @media (min-width: 640px) { .sm\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  /* Pay tab: stub column wide, By Source + Metrics narrow beside it. */
  .pay-3col { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1024px) { .pay-3col { grid-template-columns: minmax(0, 1.35fr) minmax(0, .85fr) minmax(0, .85fr); } }
  /* Sales-log queue strip: four equal segments across the full row. */
  .queue-strip > button { flex: 1 1 0; min-width: 0; }
  .queue-strip-short { display: none; }
  @media (max-width: 640px) {
    .queue-strip > button { padding-left: 4px; padding-right: 4px; font-size: 10px; gap: 4px; }
    .queue-strip-full { display: none; }
    .queue-strip-short { display: inline; }
  }
  /* Dashboard toolbar: + New Sale fills the row; Today + info hug the right. */
  .dash-toolbar .dash-newsale { flex: 1 1 auto; }
  .dash-toolbar > select, .dash-toolbar > button:not(.dash-newsale), .dash-toolbar > div { flex: 0 0 auto; }
  @media (max-width: 640px) {
    /* ── Calendar on phones (per Isaac — Google Calendar month feel) ──
       Agents become one horizontal chip strip; the month grid takes the
       full width with short cells and slim per-agent chips (name only, no
       times, no + badges). Tap a chip for the shift, a day to add. */
    .cal-layout { flex-direction: column; }
    .cal-sidebar { width: 100% !important; max-height: none !important; overflow: visible !important; padding: 8px !important; }
    .cal-sidebar-head { padding-bottom: 4px; }
    .cal-agent-list { flex-direction: row !important; flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .cal-agent-row { flex: 0 0 auto; border: 1px solid var(--border-2); border-radius: 999px; padding: 3px 8px 3px 6px !important; gap: 5px !important; }
    .cal-agent-row input[type=checkbox] { width: 12px; height: 12px; }
    .cal-agent-hours, .cal-agent-edit { display: none !important; }
    .cal-month-cell { min-height: 58px !important; padding: 2px !important; gap: 1px !important; }
    .cal-month-cell > .flex { margin-bottom: 0 !important; }
    .cal-month-cell .text-xs { font-size: 10px !important; }
    .cal-add-badge { display: none !important; }
    .cal-chip { padding: 1px 3px !important; font-size: 8px !important; border-radius: 3px !important; line-height: 1.25; }
    .cal-chip-time { display: none !important; }
    .cal-legend { display: none !important; }
    .cal-month-cell .text-\[9px\] { font-size: 8px !important; padding: 1px 3px !important; }
    .cal-month-cell .cal-slot-bar { padding: 3px 4px !important; border-radius: 0; }
    .cal-month-cell .cal-slot-bar > div:first-child span:first-child { font-size: 8px !important; letter-spacing: 0 !important; }
    .cal-month-cell .cal-rep-chips { display: none !important; }           /* chips → count badge only */
    .cal-month-cell .cal-slot-bar > div:last-child.text-\[11px\] { display: none !important; } /* "No reps" hint */
    /* Revenue Goals card: let crowded rows wrap with breathing room and
       keep the big money figures from colliding with their labels. */
    .rev-goal-card .flex.items-center.justify-between { flex-wrap: wrap; row-gap: 2px; }
    .rev-goal-card { padding: 14px !important; }
    /* Cards: slightly tighter default padding so content wins the width. */
    .card.p-5 { padding: 14px; }
    /* Modals: use the full phone width instead of floating with margins. */
    .modal-overlay .card { max-width: calc(100vw - 16px) !important; margin-top: 12px; margin-bottom: 12px; }
    /* Pill tab groups scroll sideways instead of wrapping into a pile. */
    .pill-tabs { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; }
    /* Sales header (per Isaac): Inside/D2D/Techs toggle spans the whole row,
       the tab dropdown ("Dashboard") drops to its own row underneath. */
    .sales-mode-toggle { display: flex !important; width: 100%; margin-right: 0 !important; }
    .sales-mode-btn { flex: 1 1 0; }
    .sales-tab-select { flex: 0 0 100% !important; }
    /* Same breathing room below the Dashboard dropdown as between it and
       the rep-type toggle above (the desktop mb-4 read as a gap on phones). */
    .sales-subtabs { margin-bottom: 12px !important; row-gap: 12px !important; border-bottom: 0 !important; }
    .sales-subtabs .sales-tab-select { padding: 0 !important; }
    /* …and the same 12px from + New Sale down to the Revenue Pacer (the
       dashboard column's gap-5 is 20px; pull the toolbar's slot in by 8). */
    .dash-toolbar { margin-bottom: -8px; }
    /* Reporting → Overview: the 5 metric columns (and compare pairs) stack
       into ONE column on phones instead of a 1230px sideways scroll. */
    .rep-cols { grid-template-columns: 1fr !important; min-width: 0 !important; }
    /* Reporting filter bar: Office + Time range share the row, ⓘ on the
       right of that same row (the flex spacer pushed it to its own line). */
    .rep-filter-row { flex-wrap: nowrap !important; align-items: flex-end; }
    .rep-filter-row .rep-filter-pick { flex: 1 1 0; min-width: 0; }
    .rep-filter-row .rep-filter-pick select { min-width: 0 !important; width: 100%; }
    .rep-filter-row .rep-filter-pick > div:last-child { flex-wrap: nowrap; }
    .rep-filter-row .rep-filter-spacer { display: none; }
    /* Indicators leaderboard header: title + tools on one row, search on
       its own full-width row underneath; the rep count is dropped. */
    .lb-head .lb-tools { display: contents; }
    .lb-head .lb-count { display: none; }
    .lb-head { justify-content: flex-start !important; }
    .lb-head .lb-title { order: 1; margin-right: auto; }
    .lb-head .lb-tools > * { order: 2; }
    .lb-head .lb-search { order: 3; flex: 0 0 100% !important; }
    /* Stat tiles built with inline minWidth flex rows stack cleaner. */
    .flex.gap-2.flex-wrap > .flex-1[style*="min-width: 105px"],
    .flex.gap-2.flex-wrap > .flex-1[style*="minWidth"] { min-width: 46% !important; }
  }  /* no sideways rubber-band / swipe-nav on trackpads (X only — the -y variant froze wheel scroll once) */
  /* whyridd.com is razor-sharp: kill the radius on every box utility while
     keeping .rounded-full (avatars, count badges, status pills) round. */
  .rounded, .rounded-md, .rounded-lg, .rounded-xl, .rounded-2xl, .rounded-3xl { border-radius: 0 !important; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: var(--shadow-sm);
    transition: background-color .15s ease, border-color .15s ease;
  }
  .card-2 {
    background: var(--card-2);
    border-radius: 0;
  }
  /* Hypebeast display type — Anton poster face for tab titles + hero numbers. */
  .font-display { font-family: var(--font-display); font-weight: 400 !important; letter-spacing: .015em; }
  .hb-kicker { text-transform: uppercase; letter-spacing: .18em; font-weight: 700; }
  /* Every page / tab title + section header becomes a poster headline. Anton is
     a single weight, so force 400 to avoid synthetic-bold from font utilities. */
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400 !important; letter-spacing: .02em; }
  h1 { font-size: clamp(2.5rem, 6vw, 6rem); line-height: .92; text-transform: uppercase; }
  h2 { letter-spacing: .01em; }
  /* Toolbar pills (Presets · Filters · trophy · Pick reps …): one height and
     one horizontal padding everywhere, icon-only ones included, so a row of
     them lines up (per Isaac). */
  button.rounded-xl.px-2\.5.py-1.text-\[11px\]:not(.w-full) {
    padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  /* Manage Teams on phones (per Isaac): rows wrap to two lines — name + chips
     on top, last-active / status / tier / team underneath — so the list only
     ever scrolls vertically. Never sideways. */
  @media (max-width: 640px) {
    #manage-reps-list { overflow-x: hidden !important; }
    #manage-reps-list .mt-rep-row { flex-wrap: wrap; row-gap: 6px; padding-left: 12px !important; padding-right: 12px !important; }
    #manage-reps-list .mt-rep-row > div:first-child { flex: 1 1 100%; min-width: 0; }
    #manage-reps-list .mt-rep-controls { flex: 1 1 100%; flex-wrap: wrap; justify-content: flex-start; }
    #manage-reps-list .mt-rep-controls select { max-width: 46%; }
  }
  /* Pricing tab: phone = quote pinned on top, slick below (DOM order);
     desktop = slick column left, quote column right, quote sticky (per Isaac). */
  .pricing-layout { display: flex; flex-direction: column; max-width: 760px; }
  @media (min-width: 1024px) {
    .pricing-layout { display: grid; grid-template-columns: minmax(0, 760px) minmax(420px, 500px); gap: 16px; align-items: start; justify-content: center; max-width: 1280px; }
    .pricing-layout > .pricing-board { order: 1; }
    .pricing-layout > .pricing-quote { order: 2; }
    .pricing-quote .pricing-qgrid { grid-template-columns: minmax(0, 1fr) !important; }   /* totals block drops under the lines in the narrow column */
    .pricing-quote .pricing-qgrid > div:last-child { min-width: 0 !important; }
  }
  /* Phones: program tiles 2×2 instead of four across; quote totals stack. */
  @media (max-width: 639px) {
    .pricing-board [style*="1.05fr 1fr 1fr 1fr"] { grid-template-columns: 1fr 1fr !important; }
    .pricing-quote .pricing-qgrid { grid-template-columns: minmax(0, 1fr) !important; }
    .pricing-quote .pricing-qgrid > div:last-child { min-width: 0 !important; }
  }
  /* "New version available" banner (src/10-core.js): everything pinned to
     the top of the viewport moves down by the banner's height. */
  body.has-nv-banner header.page-header { top: var(--nv-banner, 0px) !important; }
  body.has-nv-banner main { margin-top: var(--nv-banner, 0px); }
  body.has-nv-banner #indFixedBar { top: calc(60px + var(--nv-banner, 0px) + env(safe-area-inset-top, 0px)) !important; }
  /* Competitions PLAIN MODE (per Isaac): looks live in Cam's app now; this
     tab only has to be readable + verifiable. Strip every decorative
     treatment inside the comp page — inline colours, posters, artwork,
     display type — down to plain cards and tables. Controls keep their
     borders so they still read as controls. */
  .comp-plain *:not(button):not(input):not(select):not(option):not(canvas)[style*="background"] { background: var(--card) !important; background-image: none !important; }
  .comp-plain *:not(button):not(input):not(select):not(option)[style*="color"] { color: var(--text) !important; }
  .comp-plain [style*="font-size"] { font-size: 13px !important; line-height: 1.35 !important; }
  .comp-plain [style*="font-family"], .comp-plain .font-display, .comp-plain h1, .comp-plain h2, .comp-plain h3 { font-family: inherit !important; font-weight: 700 !important; letter-spacing: 0 !important; text-transform: none !important; font-size: 14px !important; }
  .comp-plain img, .comp-plain video { display: none !important; }
  .comp-plain [style*="box-shadow"], .comp-plain [style*="text-shadow"], .comp-plain [style*="filter"] { box-shadow: none !important; text-shadow: none !important; filter: none !important; }
  .comp-plain [style*="min-height"] { min-height: 0 !important; }
  .comp-plain .card { background: var(--card) !important; color: var(--text) !important; border: 1px solid var(--border) !important; }
  .comp-plain table { border-collapse: collapse !important; border-spacing: 0 !important; width: 100%; }
  .comp-plain th, .comp-plain td { border: 1px solid var(--border) !important; padding: 6px 8px !important; font-size: 12px !important; background: var(--card) !important; color: var(--text) !important; border-radius: 0 !important; }
  .comp-plain th { background: var(--card-2) !important; font-weight: 700 !important; text-transform: uppercase; font-size: 10px !important; letter-spacing: .04em; }
  .comp-plain button { background: var(--card) !important; color: var(--text) !important; border: 1px solid var(--border-2) !important; }
  /* Keep the fixed top-bar tab title compact (it lives in a ~60px header). */
  .hb-topbar-title { font-size: clamp(1.45rem, 2.6vw, 2.1rem) !important; line-height: 1 !important; text-transform: uppercase; }

  /* Text helpers driven by CSS vars */
  .text-default  { color: var(--text); }
  .text-muted-   { color: var(--text-muted); }
  .text-subtle-  { color: var(--text-subtle); }
  .bg-card-      { background: var(--card); }
  .bg-card2-     { background: var(--card-2); }
  .border-      { border-color: var(--border); }
  .border2-     { border-color: var(--border-2); }

  /* Chips */
  .chip { display:inline-flex; align-items:center; padding:3px 10px; border-radius: 0; font-size:11px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  .chip-pending   { background:rgba(223,100,58,.12); color:#C8552E; border:1px solid rgba(223,100,58,.35); }
  .chip-approved  { background:rgba(223,100,58,.18); color:#A9441F; border:1px solid rgba(223,100,58,.45); }
  .chip-serviced  { background:rgba(223,100,58,.14); color:#C8552E; border:1px solid rgba(223,100,58,.40); }
  .chip-below     { background:rgba(156,63,30,.10);  color:#9C3F1E; border:1px solid rgba(156,63,30,.30); }
  .chip-nsf       { background:rgba(220,38,38,.10);  color:#B91C1C; border:1px solid rgba(220,38,38,.30); }
  .chip-rejected  { background:rgba(220,38,38,.15);  color:#991B1B; border:1px solid rgba(220,38,38,.45); }

  :root[data-theme="dark"] .chip-pending   { color:#FF7A50; }
  :root[data-theme="dark"] .chip-approved  { color:#FFA98C; }
  :root[data-theme="dark"] .chip-serviced  { color:#FF7A50; }
  :root[data-theme="dark"] .chip-below     { color:#FFB899; }
  :root[data-theme="dark"] .chip-nsf       { color:#fca5a5; }
  :root[data-theme="dark"] .chip-rejected  { color:#f87171; }

  /* Sidebar / nav buttons */
  .tab-btn {
    transition: all .15s ease;
    color: var(--text-muted);
  }
  .tab-btn:hover {
    background: var(--card-2);
    color: var(--text);
  }
  .tab-btn[data-active="true"] {
    background: var(--accent);
    color: var(--accent-text);
  }
  .tab-btn[data-active="true"] svg { stroke: var(--accent-text); }

  /* Inputs */
  input, select, textarea {
    background: var(--input-bg) !important;
    color: var(--text) !important;
    border: 1px solid var(--input-border) !important;
  }
  input::placeholder, textarea::placeholder { color: var(--text-subtle) !important; }
  /* Competitions landing (poster card) */
  html:has(body.comp-landing), body.comp-landing { background: var(--accent); }
  /* The frosted top bar would tint peach over the orange landing — keep it
     solid white/dark there so it matches every other tab (per Isaac). */
  body.comp-landing .page-header { background: var(--bg) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .comp-landing-poster { display: flex; flex-direction: column; margin: 0 -16px -16px; min-height: calc(100vh - 76px - 16px - 46px); border-radius: 0 !important; }
  /* Desktop: the landing is sized to the viewport, so kill the page scroll
     (and the rubber-band) entirely while it's up. Phones keep scrolling. */
  @media (min-width: 1024px) and (min-height: 600px) { html:has(body.comp-landing), body.comp-landing { overflow: hidden; } }
  .comp-landing-top { flex: 1 1 auto; }
  @media (min-width: 640px) { .comp-landing-poster { margin: 0 -24px -24px; min-height: calc(100vh - 76px - 24px - 46px); } }
  .comp-landing-pad { padding: 32px 24px 0; }
  .comp-landing-bottom { padding-top: 24px; padding-bottom: 32px; }
  .comp-landing-rule { margin: 0 24px; border-top: 1px solid rgba(0,0,0,.25); }
  .comp-landing-copy { font-size: 14px; }
  @media (min-width: 640px) {
    .comp-landing-pad { padding: 32px 48px 0; }
    .comp-landing-bottom { padding-top: 18px; padding-bottom: 28px; }
    .comp-landing-rule { margin: 0 48px; }
    .comp-landing-copy { font-size: 15px; padding-top: 12px; }
  }
  /* Standard control box (px-2.5 py-1 text-[11px]) — pin the line box so a
     native <select> (iOS gives it a taller intrinsic height) and a button
     holding an emoji (taller glyph line box) come out the exact same height
     as a plain text button beside them. Selects drop the UA chrome and get
     a small chevron instead. */
  select.text-\[11px\], input.text-\[11px\], button.text-\[11px\] {
    line-height: 16.5px !important; height: 28px !important; min-height: 28px !important;
    box-sizing: border-box;
  }
  /* Icon-only pills (trophy, pencil …) are flex boxes, so the line box above
     doesn't size them — the fixed height does, and this keeps the glyph
     centred in it. */
  button.text-\[11px\].flex, button.text-\[11px\].inline-flex { align-items: center; }
  select.text-\[11px\] {
    -webkit-appearance: none !important; appearance: none !important;
    padding-right: 22px !important;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round'/></svg>") !important;
    background-repeat: no-repeat !important; background-position: right 8px center !important;
  }
  input:focus, select:focus, textarea:focus {
    outline: none !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px rgba(223,100,58,.25) !important;
  }

  /* Bingo card */
  .bingo-square {
    aspect-ratio: 1/1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 8px; border-radius: 0;
    border: 1px solid var(--border-2);
    background: var(--card-2);
    font-size: 11px; line-height: 1.2;
    color: var(--text-muted);
    transition: all .2s;
  }
  .bingo-square[data-met="true"] {
    background: rgba(223,100,58,.14);
    border-color: var(--accent);
    color: var(--text);
  }
  .bingo-square[data-met="true"] .check { opacity:1; transform:scale(1); }
  .bingo-square .check { opacity:0; transform:scale(.5); transition:all .2s; font-size:22px; color:var(--accent); }

  /* Scrollbars */
  .scroll-x { overflow-x:auto; scrollbar-width:thin; }
  .scroll-x::-webkit-scrollbar { height:6px; }
  .scroll-x::-webkit-scrollbar-thumb { background:var(--border-2); border-radius: 0; }

  /* Spinner */
  /* ZIP number labels on the Geographic map (printed-zip-map style). */
  .zip-label { background: transparent !important; border: none !important; box-shadow: none !important;
    font: 700 10px 'IBM Plex Mono', ui-monospace, monospace; color: #323230;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff; pointer-events: none; }
  .zip-label::before { display: none; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(223,100,58,.25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  /* Styled hover tooltip — replaces the browser's plain title bubble app-wide */
  .app-tip { position:fixed; z-index:10000; max-width:280px; padding:6px 10px; border-radius: 0;
    background:#323230; color:#F3F3F3; font-size:11px; font-weight:600; line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .12s; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* RevHawk sync icon spinning while a refresh is in flight */
  .icon-spin svg { animation:spin .9s linear infinite; transform-origin:50% 50%; }

  .fade-in { animation:fade .2s ease; }
  /* Opacity-only on purpose: a transform here (even translateY(4px)) makes
     every position:fixed descendant — like the Indicators filter bar —
     anchor to this element instead of the viewport for the duration of the
     animation, so the bar visibly jumped down and snapped back on every
     re-render. */
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* Spring Cleaning mascot: walks slowly across the header while sweeping.
     He's drawn facing left, so scaleX(-1) faces him right when moving right.
     The walker handles the slow glide + flip; the img rocks (broom sweep);
     dust puffs kick up at the broom head. No vertical bob. */
  .sc-sweep-track { position:relative; flex:1 1 120px; min-width:144px; height:92px; align-self:stretch; overflow:hidden; }
  .sc-walker {
    position:absolute; bottom:0; left:0; width:80px; height:88px;
    transform-origin:center bottom;
    animation: scWalk 30s ease-in-out infinite;
    will-change:left, transform;
  }
  .sc-walker .sc-sweeper {
    position:absolute; bottom:0; left:0; height:84px; width:auto; display:block;
    transform-origin:46% 92%;
    animation: scSweep 2.6s ease-in-out infinite;
  }
  .sc-dust { position:absolute; bottom:2px; left:2px; width:32px; height:24px; pointer-events:none; }
  .sc-dust span {
    position:absolute; bottom:0; left:0; width:4px; height:4px; border-radius:50%;
    background: rgba(110,110,98,.5); opacity:0;
    animation: scDust 2.6s ease-out infinite;
  }
  .sc-dust span:nth-child(2) { left:5px;  width:3px;   height:3px;   animation-delay:.87s; }
  .sc-dust span:nth-child(3) { left:9px;  width:2.5px; height:2.5px; animation-delay:1.73s; }
  @keyframes scWalk {
    0%,3%    { left:0;                  transform:scaleX(-1); }
    47%      { left:calc(100% - 80px);  transform:scaleX(-1); }
    50%,53%  { left:calc(100% - 80px);  transform:scaleX(1); }
    97%      { left:0;                  transform:scaleX(1); }
    100%     { left:0;                  transform:scaleX(-1); }
  }
  @keyframes scSweep {
    0%,100% { transform:rotate(-5deg); }
    50%     { transform:rotate(3.5deg); }
  }
  @keyframes scDust {
    0%   { opacity:0;  transform:translate(0,0)      scale(.4); }
    25%  { opacity:.55; }
    100% { opacity:0;  transform:translate(-8px,-8px) scale(1.4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sc-walker { animation:none; left:calc(50% - 40px); transform:scaleX(-1); }
    .sc-walker .sc-sweeper, .sc-dust span { animation:none; }
    .sc-dust span { opacity:0; }
  }

  /* Top Gun mascot: a stealth bomber glides slowly back and forth across the
     header. Drawn nose-right, so scaleX(-1) faces it left when flying left.
     The flyer handles the glide + flip; the plane banks gently. */
  .tg-fly-track { position:relative; flex:1 1 150px; min-width:160px; height:76px; align-self:center; overflow:hidden; }
  .tg-flyer {
    position:absolute; top:50%; left:0; width:112px; margin-top:-30px;
    animation: tgFly 22s ease-in-out infinite;
    will-change:left, transform;
  }
  .tg-flyer .tg-plane {
    display:block; width:112px; height:auto;
    transform-origin:center center;
    animation: tgBank 4.5s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  @keyframes tgFly {
    0%,3%    { left:0;                   transform:scaleX(1); }
    47%      { left:calc(100% - 112px);  transform:scaleX(1); }
    50%,53%  { left:calc(100% - 112px);  transform:scaleX(-1); }
    97%      { left:0;                   transform:scaleX(-1); }
    100%     { left:0;                   transform:scaleX(1); }
  }
  @keyframes tgBank {
    0%,100% { transform:rotate(-4deg); }
    50%     { transform:rotate(4deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tg-flyer { animation:none; left:calc(50% - 56px); }
    .tg-flyer .tg-plane { animation:none; }
  }

  /* Goal progress bar track */
  .goal-track {
    background: var(--border);
    border-radius: 0;
    height: 10px;
    overflow: hidden;
    position: relative;
  }
  .goal-fill {
    background: var(--accent);
    height: 100%;
    border-radius: 0;
    transition: width .3s ease;
  }
  .goal-ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-subtle);
  }

  /* Installed app (home-screen / standalone): with viewport-fit=cover the
     canvas runs edge-to-edge UNDER the iPhone status bar and home indicator,
     and there's no browser chrome to push content down — so the top of every
     screen (and modal) was getting clipped. Pad by the device's safe areas;
     env() resolves to 0 everywhere else, so browsers are unaffected. */
  @media all and (display-mode: standalone) {
    .page-header { padding-top: calc(1rem + env(safe-area-inset-top)) !important; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    .modal-overlay > * {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* EVERY fixed-position offset must grow by the same inset the header
       grew by, or content tucks under it (the "cut-off dropdowns" bug):
       main reserves the fixed header's height; the Indicators filter bar
       pins below the header. */
    main { padding-top: calc(76px + env(safe-area-inset-top)) !important; }
    #indFixedBar { top: calc(60px + env(safe-area-inset-top)) !important; }
  }

  /* Floating tooltip (rendered to body so it escapes card overflow:hidden) */
  .ridd-tooltip {
    position: fixed;
    background: var(--eerie, #323230);
    color: #F3F3F1;
    padding: 8px 12px;
    border-radius: 0;
    font-size: 11px;
    line-height: 1.4;
    pointer-events: none;
    z-index: 10001;  /* above modal overlays (2000) — chart tips were invisible inside the rep drill-down */
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    max-width: 240px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .12s ease, transform .12s ease;
    white-space: normal;
  }
  .ridd-tooltip.show { opacity: 1; transform: translateY(0); }
  .ridd-tooltip strong { color: #DF643A; display: block; font-size: 11px; margin-bottom: 2px; }
  .ridd-tooltip .desc { color: rgba(243,243,243,.82); font-size: 11px; white-space: pre-line; }
  .ridd-tooltip.wide { max-width: 340px; }
  .ridd-tooltip::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: var(--eerie, #323230);
  }
  /* Flipped-below variant: arrow moves to the top edge */
  .ridd-tooltip.below::after { bottom: auto; top: -5px; }
  :root[data-theme="light"] .ridd-tooltip { background: #323230; }
  :root[data-theme="light"] .ridd-tooltip::after { background: #323230; }
  .tooltip-trigger { cursor: help; }

  /* Header bar */
  .page-header {
    background: var(--header-bg);
    color: var(--header-text);
  }
  .page-header .icon-btn {
    background: rgba(255,255,255,.08);
    border-radius: 0;
    width: 36px; height: 36px;
    align-items: center; justify-content: center;
    color: var(--header-text);
    transition: background .15s ease;
    /* Anchor for .notif-badge — without this the absolute-positioned
       badge escapes to the page-header / body and floats free. */
    position: relative;
  }
  .page-header .icon-btn.show { display: inline-flex; }
  .page-header .icon-btn:hover { background: rgba(255,255,255,.15); }

  /* Floating Action Button */
  .fab {
    position: fixed; right: 20px; bottom: 20px;
    background: var(--accent); color: var(--accent-text);
    border-radius: 0; padding: 14px 22px;
    font-weight: 700; font-size: 14px;
    box-shadow: var(--shadow-lg);
    z-index: 30;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .15s ease, background .15s ease;
  }
  .fab:hover { background: var(--accent-hover); transform: translateY(-1px); }

  /* Leaflet stacks its panes at z-index 400–1000, which beat the fixed
     page header (30) and let the map scroll OVER it. isolation: isolate
     traps those z-indexes inside the map box, so it stacks like any card. */
  .leaflet-container { isolation: isolate; position: relative; z-index: 0; }
  /* Modal overlay — z-index must beat Leaflet's controls (max 1000) so
     the Reporting tab's drill modals don't get drawn under the map. */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px; overflow-y: auto;
    backdrop-filter: blur(2px);
  }

  /* Tabs (pill-style for Revenue Goal) */
  .pill-tabs {
    display: inline-flex; padding: 2px; gap: 2px;
    background: var(--card-2); border-radius: 0; border: 1px solid var(--border);
  }
  /* Sized to the standard control (px-2.5 py-1 text-[11px]) so a pill
     group sits flush with the buttons beside it. */
  .pill-tabs button {
    padding: 2px 10px; border-radius: 0;
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    transition: all .15s ease;
  }
  .pill-tabs button[data-active="true"] {
    background: var(--text);
    color: var(--bg);
  }

  /* Sidebar transitions */
  .sidebar { background: var(--sidebar-bg); border-color: var(--sidebar-border); }

  /* Notification bell badge */
  .notif-badge {
    position: absolute; top: -2px; right: -2px;
    min-width: 16px; height: 16px; border-radius: 50%;
    background: #DC2626; color: #fff;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; line-height: 1;
  }
  .notif-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 340px; max-height: 420px; overflow-y: auto;
    z-index: 40; display: none;
  }

  /* Global search bar */
  .search-bar { position: relative; flex: 1; max-width: 360px; margin: 0 12px; }
  .search-bar input {
    width: 100%; border-radius: 0 !important;
    padding: 7px 14px 7px 36px !important; font-size: 13px;
    background: rgba(255,255,255,.1) !important;
    border: 1px solid rgba(255,255,255,.15) !important;
    color: var(--header-text) !important;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,.4) !important; }
  .search-bar input:focus { background: rgba(255,255,255,.18) !important; border-color: rgba(255,255,255,.3) !important; }
  .search-bar .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,.4); pointer-events: none;
  }
  .search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 320px; overflow-y: auto; z-index: 40;
    /* The dropdown lives inside the dark header — without an explicit color
       override, the cream header-text leaks down through the card and the
       customer name renders nearly invisible on the white card background. */
    color: var(--text);
  }

  /* Mobile bottom nav */
  .mobile-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px 0 env(safe-area-inset-bottom, 6px);
    z-index: 30;
  }
  .mobile-nav button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 9px; font-weight: 600; color: var(--text-muted);
    padding: 4px 12px; transition: color .15s; background: none; border: none;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .mobile-nav button[data-active="true"] { color: var(--accent); }
  .more-popover {
    position: absolute; bottom: calc(100% + 8px); right: -12px;
    min-width: 200px; padding: 6px; z-index: 40; display: none;
  }

  /* Leaderboard row transitions + badge flash */
  .leaderboard-row { transition: background-color .3s ease; }
  .badge-flash { animation: badgeFlash .6s ease; }
  @keyframes badgeFlash {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.5); filter: brightness(1.5); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  /* Smooth momentum scrolling on every horizontal table wrapper */
  .scroll-x, .overflow-x-auto { -webkit-overflow-scrolling: touch; }

  /* Scrolling tables never rubber-band sideways past their edge (the
     "table slides into blank space" effect on iOS) — the frozen first column
     and the card edge stay glued. Vertical bounce stays normal. */
  .scroll-x, .overflow-x-auto, div[style*="overflow: auto"], div[style*="overflow:auto"] {
    overscroll-behavior-x: none;
    -webkit-overflow-scrolling: auto;
  }
  .rpt-subtabs-select { display:none; }
  @media (max-width: 640px) {
    .desktop-only { display:none !important; }
    /* Reporting sub-tabs: strip on desktop, one dropdown on phones */
    .rpt-subtabs { display:none !important; }
    .rpt-subtabs-select { display:block; }
    .fab { bottom: 72px !important; }
    /* (bottom tab bar retired — no reserved space needed) */
    .search-bar { max-width: none; margin: 0 4px; }
    .notif-dropdown { width: 300px; right: -40px; }

    /* Modals: full-screen sheets on phones — edge to edge, no floating
       card, no double-scroll. Inline max-heights are overridden so the
       sheet owns the whole dynamic viewport. */
    .modal-overlay { padding: 0; }
    .modal-overlay > * {
      max-width: 100% !important;
      margin: 0 !important;
      border-radius: 0 !important;
      max-height: 100dvh !important;
    }

    /* Header: tighter so the icon cluster fits */
    .page-header { padding-left: 8px !important; padding-right: 8px !important; gap: 6px; }
    main { padding-left: 8px !important; padding-right: 8px !important; }   /* keep content flush with the header on phones too */
    #indFixedBar > div { padding-left: 8px !important; padding-right: 8px !important; }   /* Indicators toolbar hugs the same gutter */
    .icon-btn { width: 34px; height: 34px; }

    /* Spring Cleaning standings poster: keep the print layout intact and
       let the phone scroll it sideways */
    #spring-standings-poster { overflow-x: auto; }
    #spring-standings-poster > div { min-width: 760px; }

    /* Nav menu shouldn't overflow short screens */
    .nav-menu { max-height: calc(100vh - 90px); overflow-y: auto; }

    /* Native pickers: 16px stops iOS from zoom-jumping into the field.
       Must cover ALL controls — inputs created without a type attribute
       (most of the Sales Log form) never matched the old [type=…]
       selectors, so iOS kept zooming and the layout stuck "too big". */
    /* (16px bump retired — maximum-scale=1 on the viewport meta stops the
       iOS focus-zoom instead, so phone controls keep the standard 11px and
       line up with the buttons beside them. Pinch-zoom still works: iOS
       ignores maximum-scale for pinch, only for the input auto-zoom.) */

    /* Wide tables: keep the REP column pinned while the metrics scroll —
       phone users lose track of whose row they're reading otherwise. */
    [data-section='rep-leaderboard'] table th:first-child,
    [data-section='rep-leaderboard'] table td:first-child {
      position: sticky; left: 0; z-index: 1;
      background: var(--card);
      box-shadow: 2px 0 0 var(--border);
    }
    [data-section='rep-leaderboard'] table thead th:first-child { z-index: 2; background: var(--card-2); }

    /* Wide tables never feel cut off: a soft right-edge fade signals there's
       more to swipe. (Static fade — cheap and universal.) */
    .scroll-x, .overflow-x-auto {
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), rgba(0,0,0,.25) 100%);
      mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), rgba(0,0,0,.25) 100%);
    }

    /* NRLA standings: pin Seed + Team while the money columns swipe */
    .nrla-standings th, .nrla-standings td { white-space: nowrap; }

    /* NRLA hero on phones: the roster/ⓘ buttons + LAST SYNC stamp become one
       tidy row under the chips (sync left, buttons right) instead of a
       floating centered cluster. */
    .nrla-hero-side {
      flex-direction: row-reverse !important;
      align-items: center !important;
      justify-content: space-between !important;
      width: 100%;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.14);
    }
    .nrla-hero-side > div:last-child { margin-top: 0 !important; text-align: left !important; }
    .nrla-standings th:nth-child(1), .nrla-standings td:nth-child(1) {
      position: sticky; left: 0; z-index: 2; background: var(--card);
      width: 42px; min-width: 42px; max-width: 42px;
    }
    .nrla-standings th:nth-child(2), .nrla-standings td:nth-child(2) {
      position: sticky; left: 42px; z-index: 2; background: var(--card);
      box-shadow: 2px 0 0 var(--border);
    }
    .nrla-standings thead th:nth-child(1), .nrla-standings thead th:nth-child(2) { background: #0E1C30; z-index: 3; }
  }

  /* Momentum scrolling on every sideways-scrolling table (iOS) */
  .scroll-x, .overflow-x-auto { -webkit-overflow-scrolling: touch; }
  @media (min-width: 641px) {
    .mobile-only { display:none !important; }
    .mobile-nav { display: none !important; }
  }

  /* ═══════════ SLEEK PASS — crisper type, softer surfaces, calmer motion ═══════════ */
  :root { --ease-out: cubic-bezier(.22,.61,.36,1); }
  .card { border-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -24px rgba(0,0,0,.28); }
  .card-2 { border-radius: 0; }
  button {
    transition: background-color .15s var(--ease-out), color .15s var(--ease-out),
                border-color .15s var(--ease-out), box-shadow .15s var(--ease-out),
                transform .12s var(--ease-out), opacity .15s var(--ease-out), filter .15s var(--ease-out);
  }
  button:active { transform: scale(.97); }

  @keyframes _ovlIn { from { opacity: 0; } }

  html { -webkit-tap-highlight-color: transparent; }
  button, [draggable="true"] { touch-action: manipulation; }   /* no double-tap zoom delay */
  /* Phones: expand every button's HIT AREA to ≥44px (Apple's minimum tap
     target) without changing visual size — dozens of 22–26px icon buttons
     (calendar arrows, roster icons, ⓘ) were near-certain mis-taps. */
  @media (pointer: coarse) {
    button { position: relative; }
    button::after { content: ''; position: absolute; left: 50%; top: 50%;
      width: max(100%, 44px); height: max(100%, 44px);
      transform: translate(-50%, -50%); }

    .ridd-tooltip::after { width: auto; height: auto; }

  .nrla-playoff { grid-column: span 2; }

  /* ═══════════ MODERN VIBE v2 — layered canvas + frosted header ═══════════
     The old look was flat: white page, white cards, hard gray borders, solid
     black top bar. Now the canvas is a soft warm off-white, cards FLOAT on
     shadow with hairline borders, and the top bar is a frosted, translucent,
     theme-adaptive glass bar (iOS style). Peel-back: delete this block. */
  :root[data-theme="light"] {

  /* ── Static-Tailwind gap fills ─────────────────────────────────────────

     (w-2.5/h-2.5), missing row separators (divide-y), missing totals rule

  @media (min-width:640px){ .sm\:py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; } }

  /* ═══ APPLE-FEEL LAYER (Jul 2026) — motion, materials, touch ═══════════

  /* No tap flash on iOS. (overscroll-behavior-y:none was here briefly —

     in Chrome entirely. Pull-to-refresh bounce is the lesser evil.) */
  * { -webkit-tap-highlight-color: transparent; }

  /* Frosted header — iOS nav-bar material. Solid fallback first.
     DARK mode: dark glass. LIGHT mode: light glass with dark content —
     a translucent BLACK bar over a white page just reads as mud. */
  .page-header {
    background: var(--header-bg);

    background: #FFFFFF;
